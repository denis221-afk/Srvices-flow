<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ServiceFlow — Backlog</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #121722;
        --panel2: #171d29;
        --text: #f4f6fa;
        --muted: #929bad;
        --line: #252d3b;
        --accent: #ff4d3d;
        --ok: #38c976;
        --warn: #ffb020;
        --blue: #4c8dff;
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(180deg, #090b0f, #10141d);
        color: var(--text);
        min-height: 100vh;
      }
      .app {
        max-width: 1500px;
        margin: auto;
        padding: 28px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 21px;
        box-shadow: 0 10px 30px #ff4d3d33;
      }
      .brand h1 {
        font-size: 22px;
        margin: 0;
      }
      .brand p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }
      .btn:hover {
        border-color: #445066;
      }
      .btn.danger {
        color: #ff7d72;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }
      .card {
        background: #121722cc;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 17px;
      }
      .card small {
        color: var(--muted);
        display: block;
        margin-bottom: 7px;
      }
      .card strong {
        font-size: 25px;
      }
      .progress-wrap {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 18px;
      }
      .progress-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .bar {
        height: 10px;
        background: #242b37;
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), #ff7a45);
        transition: 0.25s;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr 190px 190px;
        gap: 10px;
        margin-bottom: 14px;
      }
      .input,
      .select {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        padding: 11px 12px;
        outline: none;
      }
      .input:focus,
      .select:focus {
        border-color: #53617a;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #10151e;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 950px;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #171d29;
        color: #aeb6c5;
        text-align: left;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        z-index: 2;
      }
      td {
        padding: 11px 12px;
        border-bottom: 1px solid #202735;
        font-size: 14px;
        vertical-align: middle;
      }
      tbody tr:hover {
        background: #151b26;
      }
      .done-row {
        opacity: 0.58;
      }
      .done-row .task {
        text-decoration: line-through;
      }
      .check {
        width: 19px;
        height: 19px;
        accent-color: var(--ok);
        cursor: pointer;
      }
      .id {
        color: #8f99ab;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .stage {
        display: inline-flex;
        min-width: 30px;
        justify-content: center;
        padding: 4px 8px;
        border-radius: 999px;
        background: #222a38;
        color: #d7dce5;
        font-weight: 800;
      }
      .hours {
        color: #c8cfda;
      }
      .status {
        border: 1px solid var(--line);
        background: #171d29;
        color: white;
        border-radius: 8px;
        padding: 7px 9px;
      }
      .note {
        width: 100%;
        min-width: 170px;
        background: #0e131b;
        border: 1px solid #252d3b;
        color: #e8ebf0;
        border-radius: 8px;
        padding: 7px 9px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 30px;
      }
      .footer {
        color: #6f7889;
        font-size: 12px;
        text-align: center;
        padding: 18px;
      }
      .stage-title {
        font-weight: 800;
        color: #fff;
      }
      .badge {
        font-size: 11px;
        padding: 3px 7px;
        border-radius: 99px;
        margin-left: 7px;
        background: #252d3b;
        color: #b9c1cf;
      }
      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .toolbar {
          grid-template-columns: 1fr;
        }
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .app {
          padding: 16px;
        }
      }
      @media (max-width: 520px) {
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .card {
          padding: 13px;
        }
        .card strong {
          font-size: 21px;
        }
      }
    </style>
  </head>

        </table>
      </div>

      const defaults = raw
        .trim()
        .split("\n")
        .map((line) => {
          const [id, stage, task, hours, status] = line.split("|");
          return { id, stage, task, hours, status, note: "" };
        });
      const KEY = "serviceflow_backlog_v1";
      let items = load();
      function load() {
        try {
          const x = JSON.parse(localStorage.getItem(KEY));
          if (Array.isArray(x) && x.length) return x;
        } catch (e) {}
        return structuredClone(defaults);
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(items));
        render();
      }
      function esc(s = "") {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      }
      function render() {
        const q = document.querySelector("#search").value.toLowerCase();
        const sf = document.querySelector("#stageFilter").value;
        const st = document.querySelector("#statusFilter").value;
        const filtered = items.filter(
          (x) =>
            (sf === "all" || x.stage === sf) &&
            (st === "all" || x.status === st) &&
            `${x.id} ${x.task}`.toLowerCase().includes(q),
        );
        const body = document.querySelector("#tbody");
        body.innerHTML = filtered.length
          ? filtered
              .map(
                (x) =>
                  `<tr class="${x.status === "Готово" ? "done-row" : ""}"><td><input class="check" type="checkbox" ${x.status === "Готово" ? "checked" : ""} onchange="toggle('${x.id}',this.checked)"></td><td class="id">${x.id}</td><td><span class="stage">${x.stage}</span></td><td class="task">${esc(x.task)}</td><td class="hours">${x.hours || "—"}</td><td><select class="status" onchange="setStatus('${x.id}',this.value)"><option ${x.status === "Треба зробити" ? "selected" : ""}>Треба зробити</option><option ${x.status === "В роботі" ? "selected" : ""}>В роботі</option><option ${x.status === "Готово" ? "selected" : ""}>Готово</option></select></td><td><input class="note" value="${esc(x.note || "")}" placeholder="Нотатка…" oninput="setNote('${x.id}',this.value)"></td></tr>`,
              )
              .join("")
          : `<tr><td colspan="7" class="empty">Нічого не знайдено</td></tr>`;
        const done = items.filter((x) => x.status === "Готово").length,
          doing = items.filter((x) => x.status === "В роботі").length,
          total = items.length,
          p = Math.round((done / total) * 100);
        totalEl.textContent = total;
        doneEl.textContent = done;
        doingEl.textContent = doing;
        leftEl.textContent = total - done;
        percentEl.textContent = p + "%";
        progressText.textContent = `${done} / ${total}`;
        progressBar.style.width = p + "%";
      }
      function toggle(id, v) {
        const x = items.find((x) => x.id === id);
        x.status = v ? "Готово" : "Треба зробити";
        save();
      }
      function setStatus(id, v) {
        items.find((x) => x.id === id).status = v;
        save();
      }
      function setNote(id, v) {
        items.find((x) => x.id === id).note = v;
        localStorage.setItem(KEY, JSON.stringify(items));
      }
      const totalEl = document.querySelector("#total"),
        doneEl = document.querySelector("#done"),
        doingEl = document.querySelector("#doing"),
        leftEl = document.querySelector("#left"),
        percentEl = document.querySelector("#percent"),
        progressText = document.querySelector("#progressText"),
        progressBar = document.querySelector("#progressBar");
      [search, stageFilter, statusFilter].forEach((el) =>
        el.addEventListener(
          el.tagName === "INPUT" ? "input" : "change",
          render,
        ),
      );
      [...new Set(items.map((x) => x.stage))].forEach((s) =>
        stageFilter.insertAdjacentHTML(
          "beforeend",
          `<option value="${s}">Етап ${s}</option>`,
        ),
      );
      resetBtn.onclick = () => {
        if (confirm("Скинути весь прогрес і нотатки до початкового стану?")) {
          items = structuredClone(defaults);
          localStorage.setItem(KEY, JSON.stringify(items));
          render();
        }
      };
      exportBtn.onclick = () => {
        const blob = new Blob([JSON.stringify(items, null, 2)], {
            type: "application/json",
          }),
          a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "serviceflow-backlog-backup.json";
        a.click();
        URL.revokeObjectURL(a.href);
      };
      importBtn.onclick = () => fileInput.click();
      fileInput.onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const x = JSON.parse(r.result);
            if (!Array.isArray(x)) throw 0;
            items = x;
            save();
            alert("Імпорт завершено");
          } catch {
            alert("Некоректний JSON файл");
          }
        };
        r.readAsText(f);
      };
      render();
    </script>
  </body>
</html>
